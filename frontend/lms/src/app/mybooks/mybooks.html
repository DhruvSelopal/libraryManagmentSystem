<main>
  <section class="hero">
    <h1>My Borrowed Books</h1>
    <p>Books you've currently checked out</p>
  </section>

  <section class="book-section">
    @for (book of myBooks; track $index; let i = $index) {
      <div
        class="container-fluid"
        [ngClass]="book.isOverdue ? 'overdue-book' : 'borrowed-book'"
        style="text-align: center;"
      >
        <div class="row">
          <div class="col-2">&nbsp;</div>
          <div class="col-8">
            <div>
              <img
                class="bookcover"
                [src]="book.imagePath"
                [alt]="book.bookName"
              />
            </div>
          </div>
          <div class="col-2">&nbsp;</div>
        </div>

        <div class="row mt-2">
          <div class="col">
            <h4>{{ book.bookName }}</h4>
            <p class="text-muted">
              Borrowed on: {{ book.borrowDate | date:'mediumDate' }}
              <br />
              Due by: <span [ngClass]="book.isOverdue ? 'text-danger' : ''">{{ book.dueDate | date:'mediumDate' }}</span>
            </p>
          </div>
        </div>

        <div class="row mb-3">
          <div class="col-1">&nbsp;</div>
          <div class="col-10">
            <button
              class="btn btn-warning"
              (click)="returnBook(book.bookId, i)"
            >
              Return Book
            </button>
          </div>
          <div class="col-1">&nbsp;</div>
        </div>
      </div>
    }
  </section>
</main>
